<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atomic Structure</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Roboto+Mono:wght@400;700&family=Roboto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Spark Learning companion tokens */
    --bgMain: #F7F3EE;
    --bgPanel: #FFFFFF;
    --bgCard: #FFFFFF;
    --accentBlue: #6366f1;
    --accentBlueHover: #4f46e5;
    --accentPurple: #a855f7;
    --accentGreen: #10b981;
    --accentRed: #ef4444;
    --accentYellow: #f59e0b;
    --textPrimary: #1C1917;
    --textSecondary: #57534E;
    --textWarm: #2A2520;
    --textWarmSecondary: #7C6F5A;
    --textWarmMuted: #A0937B;
    --borderColor: #E8E0D2;
    --borderSubtle: #F0EBE3;
    --shadow-sm: 0 1px 2px rgba(17,17,17,0.04), 0 1px 3px rgba(17,17,17,0.06);
    --shadow-md: 0 4px 12px rgba(17,17,17,0.06), 0 2px 4px rgba(17,17,17,0.04);
    --shadow-lg: 0 16px 40px rgba(17,17,17,0.10), 0 4px 12px rgba(17,17,17,0.06);
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    --font-serif: 'Roboto Serif', Georgia, Cambria, serif;
    --font-mono: 'Roboto Mono', monospace;
    /* preserved student-copy note artifact */
    --note-bg: #fdf1c6;
    --note-ink: #2a1e08;
    --note-head: #7a3a00;
    /* domain colors */
    --proton: #ef4444;
    --neutron: #94a3b8;
    --electron: #6366f1;
    --cation: #b45309;
    --anion: #0d9488;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bgMain);
    color: var(--textPrimary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 12px 32px 8px;
    max-width: 1340px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  header .titles .eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accentBlue);
    margin-bottom: 3px;
  }
  header .titles h1 {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 20px;
    color: var(--textWarm);
    margin: 0;
    letter-spacing: 0.2px;
  }
  .step-indicator {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--textWarmMuted);
    white-space: nowrap;
  }
  .progress-track {
    max-width: 1340px;
    margin: 0 auto;
    padding: 0 32px;
  }
  .progress-track .bar {
    height: 4px;
    background: var(--borderSubtle);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-track .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accentBlue), var(--accentPurple));
    border-radius: 999px;
    transition: width 350ms ease;
  }
  .step-line { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 8px; }
  .step-line .now { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .step-line .num {
    font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--accentBlue); white-space: nowrap;
  }
  .step-line .ttl {
    font-family: var(--font-serif); font-size: 14px; font-weight: 700; color: var(--textWarm);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .step-line .count {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    letter-spacing: 0.12em; color: var(--textWarmMuted); white-space: nowrap;
  }
  main {
    max-width: 1340px;
    margin: 0 auto;
    padding: 12px 32px 20px;
  }
  .workspace {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(340px, 0.92fr);
    gap: 26px;
    align-items: start;
  }
  /* ---- stage (what students SEE) ---- */
  .stage {
    background: var(--bgCard);
    border: 1px solid var(--borderColor);
    border-top: 4px solid var(--accentBlue);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    padding: 16px 18px;
    min-height: 440px;
    display: flex;
    flex-direction: column;
    animation: fadeUp 0.4s ease-out;
  }
  .stage-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accentBlue);
    margin-bottom: 12px;
  }
  .stage-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  canvas { display: block; width: 100%; height: auto; max-height: 340px; object-fit: contain; border-radius: 12px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- side (what students WRITE) ---- */
  .side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 12px; }
  .notes-card {
    background: var(--note-bg);
    color: var(--note-ink);
    padding: 16px 22px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.58;
    box-shadow: var(--shadow-sm);
    animation: fadeUp 0.4s ease-out;
  }
  .notes-card .nc-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--note-head);
    margin-bottom: 6px;
  }
  .step-heading {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 17px;
    color: var(--note-head);
    margin-bottom: 6px;
  }
  .notes-card p { margin: 0; }
  .notes-card strong { font-weight: 700; color: var(--note-ink); }

  .notebook-prompt {
    background: #fff;
    border: 1px solid var(--borderColor);
    border-left: 4px solid var(--accentBlue);
    border-radius: 12px;
    padding: 13px 16px;
    display: flex;
    align-items: flex-start;
    gap: 11px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--textSecondary);
    box-shadow: var(--shadow-sm);
  }
  .notebook-prompt .np-tag {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 4px 8px;
    background: var(--accentBlue);
    color: #fff;
    border-radius: 6px;
    margin-top: 1px;
  }
  .notebook-prompt strong { color: var(--textPrimary); font-weight: 700; }

  nav {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding-top: 4px;
  }
  button {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 10px;
    border: 1px solid var(--borderColor);
    background: #fff;
    color: var(--textPrimary);
    cursor: pointer;
    transition: background 140ms, border-color 140ms, transform 50ms, box-shadow 140ms;
  }
  button:hover:not(:disabled) { background: var(--bgMain); border-color: var(--textWarmMuted); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary {
    background: var(--accentBlue);
    color: #fff;
    border-color: var(--accentBlue);
    box-shadow: 0 4px 14px rgba(99,102,241,0.28);
  }
  button.primary:hover:not(:disabled) { background: var(--accentBlueHover); border-color: var(--accentBlueHover); }
  .btn-group { display: flex; gap: 10px; }

  /* ---- shared interactive bits ---- */
  .tool-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--borderColor);
    background: #fff;
    color: var(--textPrimary);
    cursor: pointer;
    transition: all 140ms;
  }
  .chip:hover { border-color: var(--accentBlue); }
  .chip.active { background: var(--accentBlue); color: #fff; border-color: var(--accentBlue); }
  .readout {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .eyebrow-sm {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--textWarmMuted);
  }
  .answer-pill {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #166534;
    background: rgba(16,185,129,0.14);
    padding: 4px 10px;
    border-radius: 999px;
  }

  /* difficulty pills on practice questions */
  .diff-pill {
    display: inline-block; font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px;
  }
  .q-card .q-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .diff-simple { color: #166534; background: rgba(16,185,129,0.14); }
  .diff-challenge { color: #9a3412; background: rgba(245,158,11,0.16); }

  /* element lookup */
  .lookup {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .nuclear-symbol {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--font-serif);
  }
  .ns-stack { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
  .ns-mass { font-size: 22px; font-weight: 700; color: var(--textWarm); }
  .ns-num { font-size: 18px; font-weight: 700; color: var(--accentRed); }
  .ns-sym { font-size: 76px; font-weight: 700; color: var(--accentBlue); line-height: 0.9; }
  .lookup .el-name { font-family: var(--font-serif); font-size: 22px; font-weight: 700; color: var(--textWarm); }
  .pne-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 460px; }
  .pne-cell {
    background: var(--bgMain);
    border: 1px solid var(--borderColor);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .pne-cell .big { font-family: var(--font-mono); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pne-cell .lab { font-size: 11px; font-weight: 600; color: var(--textSecondary); margin-top: 2px; }
  .slider-row { display: flex; align-items: center; gap: 14px; width: 100%; max-width: 460px; }
  input[type=range] { flex: 1; accent-color: var(--accentBlue); height: 4px; }
  .stepper-btn { width: 40px; height: 40px; border-radius: 10px; font-size: 20px; font-weight: 700; padding: 0; }

  /* particle counter table */
  table.counter { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.counter th {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--textWarmMuted); font-weight: 700; padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--borderColor);
  }
  table.counter td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--borderSubtle); }
  table.counter td.sym { font-family: var(--font-serif); font-size: 18px; font-weight: 700; color: var(--textWarm); text-align: left; }
  table.counter input {
    width: 56px; text-align: center; font-family: var(--font-mono); font-size: 15px; font-weight: 700;
    padding: 7px 4px; border: 1px solid var(--borderColor); border-radius: 8px; background: #fff; color: var(--textPrimary);
  }
  table.counter input:focus { outline: 2px solid var(--accentBlue); outline-offset: -1px; border-color: var(--accentBlue); }
  table.counter input.ok { background: rgba(16,185,129,0.12); border-color: var(--accentGreen); color: #166534; }
  table.counter input.no { background: rgba(239,68,68,0.10); border-color: var(--accentRed); }

  /* calculators */
  .calc-grid { display: grid; gap: 10px; }
  .iso-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; font-weight: 600; color: var(--textSecondary); }
  .field input {
    font-family: var(--font-mono); font-size: 15px; font-weight: 700; padding: 9px 10px;
    border: 1px solid var(--borderColor); border-radius: 8px; background: #fff; color: var(--textPrimary);
  }
  .field input:focus { outline: 2px solid var(--accentBlue); outline-offset: -1px; }
  .calc-steps {
    background: var(--bgMain); border: 1px solid var(--borderColor); border-radius: 12px;
    padding: 14px 16px; font-family: var(--font-mono); font-size: 14px; line-height: 1.9; color: var(--textPrimary);
    min-height: 60px;
  }
  .calc-steps .res { color: var(--accentGreen); font-weight: 700; }
  .calc-steps .muted { color: var(--textWarmMuted); }

  /* reveal pattern (Check for Understanding + walkthrough) */
  .reveal-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--accentBlue); color: #fff; border: none; border-radius: 999px;
    font-weight: 700; font-size: 13px; padding: 8px 15px; cursor: pointer;
  }
  .reveal-btn:hover { background: var(--accentBlueHover); }
  .reveal-content {
    margin-top: 10px; padding: 12px 14px; background: var(--bgMain);
    border: 1px solid var(--borderColor); border-left: 4px solid var(--accentGreen);
    border-radius: 10px; font-size: 14px; line-height: 1.55; color: var(--textPrimary);
    animation: fadeUp 0.25s ease-out;
  }
  .reveal-content[hidden] { display: none !important; }
  .q-card { background: #fff; border: 1px solid var(--borderColor); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow-sm); }
  .q-card + .q-card { margin-top: 12px; }
  .q-card .q-text { font-weight: 600; font-size: 14.5px; margin-bottom: 10px; }
  .q-num { font-family: var(--font-mono); color: var(--accentBlue); font-weight: 700; margin-right: 6px; }

  .summary-card {
    background: #fff; border: 1px solid var(--borderColor); border-radius: 14px;
    padding: 14px 18px; box-shadow: var(--shadow-sm); border-left: 4px solid var(--accentPurple);
  }
  .summary-card .sc-tag { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accentPurple); margin-bottom: 4px; }
  .summary-card p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--textPrimary); }

  .pb-progress { margin-top: 4px; }
  .pb-bar { height: 5px; background: var(--borderSubtle); border-radius: 3px; overflow: hidden; margin-bottom: 5px; }
  .pb-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accentBlue), var(--accentGreen)); transition: width 300ms ease; }
  .pb-text { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--textWarmMuted); }
  .pb-text.complete { color: #166534; }

  .hint { font-size: 12px; color: var(--textWarmMuted); text-align: center; font-style: italic; }
  .caption { font-style: italic; font-size: 12px; color: var(--textWarmMuted); text-align: center; }
  .spectrum-readout { font-family: var(--font-mono); font-size: 13px; text-align: center; color: var(--textSecondary); min-height: 18px; }
  .status-line { font-family: var(--font-sans); font-size: 14px; font-weight: 600; color: var(--textPrimary); text-align: center; line-height: 1.45; min-height: 22px; }
  .status-line.complete { color: #166534; }
  button svg, .status-line svg { vertical-align: -2px; }

  @media (max-width: 980px) {
    .workspace { grid-template-columns: 1fr; }
    .stage { min-height: 380px; }
    .side { position: static; }
    header, main { padding-left: 16px; padding-right: 16px; }
    .progress-track { padding: 0 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<header>
  <div class="titles">
    <div class="eyebrow">Chemistry</div>
    <h1>Atomic Structure</h1>
  </div>
</header>
<div class="progress-track">
  <div class="step-line">
    <span class="now"><span class="num" id="stepNum">Step 01</span><span class="ttl" id="stepTitle"></span></span>
    <span class="count" id="stepIndicator">01 / 13</span>
  </div>
  <div class="bar"><div class="fill" id="progressFill"></div></div>
</div>

<main>
  <div class="workspace">
    <div class="stage">
      <div class="stage-label" id="stageLabel">What you see</div>
      <div class="stage-body" id="stage"></div>
    </div>

    <div class="side">
      <div class="notes-card">
        <div class="nc-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Copy Into Your Notes</div>
        <div class="step-heading" id="stepHeading"></div>
        <p id="notes"></p>
      </div>
      <div class="notebook-prompt">
        <div class="np-tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>DO</div>
        <div id="notebookText"></div>
      </div>
      <nav>
        <button id="resetBtn">Start Over</button>
        <div class="btn-group">
          <button id="prevBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Back</button>
          <button id="nextBtn" class="primary">Next <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
      </nav>
    </div>
  </div>
</main>

<script>
// =====================================================
//  Data
// =====================================================
const ELEMENTS = {
  1:{s:'H',n:'Hydrogen',m:1.008}, 2:{s:'He',n:'Helium',m:4.003},
  3:{s:'Li',n:'Lithium',m:6.94}, 4:{s:'Be',n:'Beryllium',m:9.012},
  5:{s:'B',n:'Boron',m:10.81}, 6:{s:'C',n:'Carbon',m:12.011},
  7:{s:'N',n:'Nitrogen',m:14.007}, 8:{s:'O',n:'Oxygen',m:15.999},
  9:{s:'F',n:'Fluorine',m:18.998}, 10:{s:'Ne',n:'Neon',m:20.180},
  11:{s:'Na',n:'Sodium',m:22.990}, 12:{s:'Mg',n:'Magnesium',m:24.305},
  13:{s:'Al',n:'Aluminium',m:26.982}, 14:{s:'Si',n:'Silicon',m:28.085},
  15:{s:'P',n:'Phosphorus',m:30.974}, 16:{s:'S',n:'Sulfur',m:32.06},
  17:{s:'Cl',n:'Chlorine',m:35.45}, 18:{s:'Ar',n:'Argon',m:39.948},
  19:{s:'K',n:'Potassium',m:39.098}, 20:{s:'Ca',n:'Calcium',m:40.078},
  26:{s:'Fe',n:'Iron',m:55.845}, 29:{s:'Cu',n:'Copper',m:63.546,mn:63},
  35:{s:'Br',n:'Bromine',m:79.904,mn:79}, 38:{s:'Sr',n:'Strontium',m:87.62},
  56:{s:'Ba',n:'Barium',m:137.327,mn:138}
};
// mass number of the most common isotope (round(Ar) is wrong for Cu, Br, Ba)
const massNum = z => ELEMENTS[z].mn ?? Math.round(ELEMENTS[z].m);
// real shell configurations past z=20, where the simple 2,8,8,2 fill breaks down
const SHELLS_HEAVY = { 26:[2,8,14,2], 29:[2,8,18,1], 35:[2,8,18,7], 38:[2,8,18,8,2], 56:[2,8,18,18,8,2] };
function shellsFor(z) {
  if (SHELLS_HEAVY[z]) return SHELLS_HEAVY[z].slice();
  const caps = [2, 8, 8, 2];
  const out = [];
  let rem = z;
  for (const c of caps) { const e = Math.min(rem, c); out.push(e); rem -= e; if (rem <= 0) break; }
  return out;
}

// =====================================================
//  Helpers
// =====================================================
const $ = (sel, root=document) => root.querySelector(sel);
function el(tag, attrs={}, kids=[]) {
  const n = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') n.className = attrs[k];
    else if (k === 'html') n.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => { if (c != null) n.append(c.nodeType ? c : document.createTextNode(c)); });
  return n;
}
function makeCanvas(stage, w, h) {
  const c = el('canvas');
  c.width = w; c.height = h;
  c.setAttribute('role', 'img');
  c.setAttribute('aria-label', (stageLabel && stageLabel.textContent) || 'Interactive chemistry visualization');
  c.textContent = 'Interactive chemistry visualization. Use the labeled controls below the image.';

  c.style.margin = '0 auto';

}
function canvasPos(c, e) {
  const r = c.getBoundingClientRect();
  return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
// approximate visible-wavelength to RGB (380-720nm)
function wavelengthToRGB(wl) {
  let r=0, g=0, b=0;
  if (wl >= 380 && wl < 440) { r = -(wl-440)/60; b = 1; }
  else if (wl < 490) { g = (wl-440)/50; b = 1; }
  else if (wl < 510) { g = 1; b = -(wl-510)/20; }
  else if (wl < 580) { r = (wl-510)/70; g = 1; }
  else if (wl < 645) { r = 1; g = -(wl-645)/65; }
  else if (wl <= 720) { r = 1; }
  const f = wl < 420 ? 0.3 + 0.7*(wl-380)/40 : wl > 700 ? 0.3 + 0.7*(720-wl)/20 : 1;
  const ch = v => Math.round(255 * Math.pow(Math.max(0, Math.min(1, v)) * f, 0.8));
  return `rgb(${ch(r)},${ch(g)},${ch(b)})`;
}

let currentTick = null;
let lastTs = null;
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(ts) {
  if (lastTs == null) lastTs = ts;
  const dt = Math.min(50, ts - lastTs);

// =====================================================
//  Electron-cloud atom renderer
//  Shells are clickable rings, but electrons buzz around
//  sporadically (probability cloud), not on clean orbits.
// =====================================================
const RADII = [46, 82, 118, 154, 190, 226, 262];

function drawNucleus(ctx, cx, cy, protons, neutrons) {
  const ng = ctx.createRadialGradient(cx-6, cy-6, 2, cx, cy, 32);
  ng.addColorStop(0, '#fca5a5'); ng.addColorStop(1, '#ef4444');
  ctx.fillStyle = ng;
  ctx.beginPath(); ctx.arc(cx, cy, 27, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '700 12px Roboto Mono, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(`${protons}p`, cx, cy - 7);
  ctx.fillText(`${neutrons}n`, cx, cy + 8);
}

class ElectronCloud {
  constructor(cx, cy, nShells = 4) { this.cx = cx; this.cy = cy; this.shells = Array.from({length: nShells}, () => []); }
  setCounts(counts) {
    for (let i = 0; i < this.shells.length; i++) {
      const want = counts[i] || 0;
      const arr = this.shells[i];
      while (arr.length < want) arr.push({
        ang: Math.random()*Math.PI*2,
        av: (Math.random()-0.5)*0.03,
        rPhase: Math.random()*Math.PI*2,
        rSpeed: 0.6 + Math.random()*0.9,
        jx: 0, jy: 0, trail: []
      });
      while (arr.length > want) arr.pop();
    }
  }
  update(dt) {
    if (REDUCED_MOTION) return;
    const f = dt * 0.06;
    for (let i = 0; i < this.shells.length; i++) {
      const dir = (i % 2) ? -1 : 1;
      // Pull from the nucleus weakens outward (distance + shielding by inner shells),
      // so inner electrons are held tight and wander little; outer ones roam more.
      const buzz = 0.8 + i * 1.15;
      for (const p of this.shells[i]) {
        // random walk on angular velocity -> sporadic, not clockwork (outer shells drift more)
        p.av += (Math.random()-0.5) * (0.010 + i*0.006);
        p.av = Math.max(-0.07, Math.min(0.07, p.av)) * 0.94;
        p.ang += p.av + dir * 0.0009 * f;
        p.rPhase += 0.004 * p.rSpeed * f;
        // bee-buzz jitter; amplitude grows with shell number (less nuclear pull)
        p.jx = (p.jx + (Math.random()-0.5)*buzz) * 0.82;
        p.jy = (p.jy + (Math.random()-0.5)*buzz) * 0.82;
      }
    }
  }
  occupiedShell() { return this.shells.reduce((m,a,i)=> a.length ? i : m, -1); }
  draw(ctx, opts={}) {
    const occ = this.occupiedShell();
    // cloud bands + dashed clickable ring guides
    if (opts.rings !== false) for (let i = 0; i < this.shells.length; i++) {
      if (!this.shells[i].length) continue;
      const r = RADII[i];
      const isVal = opts.valence && i === occ;
      const col = isVal ? '168,85,247' : '99,102,241';
      const bIn = r - 15, bOut = r + 15;
      const grad = ctx.createRadialGradient(this.cx, this.cy, bIn, this.cx, this.cy, bOut);
      grad.addColorStop(0, `rgba(${col},0)`);
      grad.addColorStop(0.5, `rgba(${col},0.12)`);
      grad.addColorStop(1, `rgba(${col},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.cx, this.cy, bOut, 0, Math.PI*2);
      ctx.arc(this.cx, this.cy, bIn, 0, Math.PI*2, true);
      ctx.fill();
      ctx.strokeStyle = isVal ? 'rgba(168,85,247,0.5)' : 'rgba(99,102,241,0.32)';
      ctx.setLineDash([3,6]); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(this.cx, this.cy, r, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }
    // electrons (with fading buzz trail)
    for (let i = 0; i < this.shells.length; i++) {
      const r = RADII[i];
      const isVal = opts.valence && i === occ;
      const core = isVal ? '#a855f7' : '#6366f1';
      const glow = isVal ? '168,85,247' : '129,140,248';
      const rAmp = 6 + i * 5; // outer shells breathe wider in/out (looser hold)
      for (const p of this.shells[i]) {
        const rr = r + Math.sin(p.rPhase) * rAmp;
        const ex = this.cx + Math.cos(p.ang)*rr + p.jx;
        const ey = this.cy + Math.sin(p.ang)*rr + p.jy;
        p.trail.unshift({x:ex, y:ey}); if (p.trail.length > 6) p.trail.pop();
        for (let k = p.trail.length-1; k > 0; k--) {
          const tp = p.trail[k]; const a = (1 - k/p.trail.length) * 0.22;
          ctx.fillStyle = `rgba(${glow},${a})`;
          ctx.beginPath(); ctx.arc(tp.x, tp.y, 4.5, 0, Math.PI*2); ctx.fill();
        }
        const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, 12);
        g.addColorStop(0, `rgba(${glow},0.6)`); g.addColorStop(1, `rgba(${glow},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = core; ctx.beginPath(); ctx.arc(ex, ey, 5.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '700 9px Roboto Mono, monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('-', ex, ey);
      }
    }
  }
}

    const reset = el('button', { type:'button' }, 'Reset electrons');
    reset.addEventListener('click', () => { placed=[0,0,0,0]; render(); });
    const addElectron = el('button', { type:'button', class:'primary' }, 'Add next electron');
    const target = () => shellsFor(z);
    const totalPlaced = () => placed.reduce((a,b)=>a+b,0);
    const outerOcc = () => placed.reduce((m,v,i)=> v>0 ? i : m, -1);
    function render() {
      const tg = target();
      const done = totalPlaced() === z && tg.every((v,i)=>v===(placed[i]||0));
      if (totalPlaced() === 0) status.innerHTML = `Click a shell cloud to drop an electron in. ${ELEMENTS[z].s} needs <strong>${z}</strong> electrons.`;
      else if (done) status.innerHTML = `<span class="answer-pill">Correct</span> &nbsp;${ELEMENTS[z].n}: ${tg.join(', ')}`;
      else status.innerHTML = `Placed ${totalPlaced()} of ${z}. Current: ${placed.slice(0, Math.max(1, outerOcc()+1)).join(', ')||'0'}`;
      const occ = outerOcc();
      valEl.innerHTML = occ < 0 ? '&nbsp;'
        : `Valence electrons: <span class="readout">${placed[occ]}</span> &nbsp;(outer shell, energy level ${occ+1})`;
    }
    // how many shells THIS element occupies (so we never draw a phantom empty shell)
    const nShells = () => shellsFor(z).length;
    // shells fill inside-out: the next shell to fill is the first one not yet at capacity
    const fillShell = () => { for (let i=0;i<nShells();i++){ if ((placed[i]||0) < caps[i]) return i; } return -1; };
    addElectron.addEventListener('click', () => {
      const shell = fillShell();
      if (shell < 0 || totalPlaced() >= z) return;
      placed[shell] = (placed[shell] || 0) + 1;
      render();
    });
    c.addEventListener('click', (ev) => {
      const p = canvasPos(c, ev);
      const d = Math.hypot(p.x - CX, p.y - CY);
      const ns = nShells();
      let shell = -1, best = 30;
      for (let i=0;i<ns;i++){ if (Math.abs(d-RADII[i]) < best) { best = Math.abs(d-RADII[i]); shell = i; } }
      const fs = fillShell();
      if (shell < 0 || fs < 0 || totalPlaced() >= z) return;
      if (shell !== fs) return; // must fill inner shells before outer ones
      placed[shell] = (placed[shell]||0)+1; render();
    });
    currentTick = (dt) => {
      ctx.clearRect(0,0,c.width,c.height);
      const mass = massNum(z);
      const ns = nShells();
      const fs = fillShell();
      // always-visible shell guides so students aim at a real target, not the abyss
      for (let i=0;i<ns;i++){
        const active = (i === fs);
        ctx.strokeStyle = active ? 'rgba(168,85,247,0.6)' : 'rgba(99,102,241,0.28)';
        ctx.setLineDash([3,7]); ctx.lineWidth = active ? 1.9 : 1.2;
        ctx.beginPath(); ctx.arc(CX, CY, RADII[i], 0, Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);
      }
      drawNucleus(ctx, CX, CY, z, mass - z);
      cloud.setCounts(placed);
      cloud.update(dt);
      cloud.draw(ctx, { valence: true });
      // capacity counts above each shell this element actually uses
      ctx.font = '700 12px Roboto Mono, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      for (let i=0;i<ns;i++){
        ctx.fillStyle = (i === fs) ? 'rgba(168,85,247,0.9)' : 'rgba(124,111,90,0.6)';
        ctx.fillText(`${placed[i]||0}/${caps[i]}`, CX, Math.max(10, CY - RADII[i] - 10));
      }
      // valence-shell label: right-aligned inside the left edge with a short leader line to the ring
      const occ = outerOcc();
      if (occ >= 0) {
        const lx = Math.max(96, CX - RADII[occ] - 12);
        ctx.strokeStyle = 'rgba(168,85,247,0.7)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(lx + 4, CY); ctx.lineTo(CX - RADII[occ] + 2, CY); ctx.stroke();
        ctx.fillStyle = 'rgba(168,85,247,0.95)'; ctx.font = '700 12px Roboto Mono, monospace';
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText('valence shell', lx, CY);
      }
    };
    stage.append(chips, status, valEl,
      el('div',{class:'tool-row'},[addElectron, reset]),
      el('div',{class:'caption'},'Inner shells fill first; the purple outer shell holds the valence electrons.'));
    render();
  }
});

// ---- Step 4: Quantized energy levels (ladder) ----
scenes.push({
  step: 'Step 4: Quantized Energy Levels',
  seeLabel: 'Energy ladder',
  heading: 'Step 4: Energy Comes in Steps',
  notes: "In the flame test, heat pushed electrons <strong>up</strong> this ladder; now watch them fall. The rungs are <strong>fixed energy levels</strong> with unequal gaps. The <strong>farther</strong> an electron falls, the <strong>more energy</strong> the light carries: its <strong>wavelength gets shorter</strong> and its <strong>frequency gets higher</strong>, sliding the color from <strong>red toward violet (ROYGBIV)</strong>. A small fall gives long-wavelength, low-frequency <strong>red</strong>; a big fall gives short-wavelength, high-frequency <strong>violet</strong>.",
  notebook: "<strong>Experience:</strong> do a <strong>small</strong> fall and a <strong>big</strong> fall with Emit.<br><strong>Record:</strong> for each fall, write the <strong>wavelength</strong>, the <strong>frequency</strong>, and the <strong>color</strong>.<br><strong>Confirm:</strong> check your data against your notes, then finish the rule: as the fall distance increases, wavelength ___, frequency ___, and the color moves toward ___.",
  build(stage) {
    const { c, ctx } = makeCanvas(stage, 520, 296);
    const NMAX = 5;
    // hand-tuned unequal spacing: big gap low down, gaps shrink upward but never crowd
    const LY = { 1:262, 2:164, 3:100, 4:60, 5:34 };
    const yOf = n => LY[n];
    let level = 1, anim = null, lastWL = null, prevWL = null, wavePhase = 0;
    const EX = 150;
    // emission color: bigger drop = more energy = shorter (bluer) wavelength
    const dropWL = (hi, lo) => {
      const dE = (1/(lo*lo)) - (1/(hi*hi));
      const norm = Math.max(0, Math.min(1, (dE - 0.02)/(0.96 - 0.02)));
      return Math.round(680 - norm*270); // 410 violet .. 680 red
    };
    const up = el('button', { class:'primary', html:'Absorb (jump up) '+ICON.up });
    const dn1 = el('button', { html:'Emit: small fall (down 1) '+ICON.down });
    const dnAll = el('button', { html:'Emit: big fall (to n=1) '+ICON.down });
    function start(to, dir){ if(anim) return; anim = { from: level, to, t:0, dir, wl: dir==='emit'?dropWL(level,to):null }; }
    up.addEventListener('click', () => { if(level<NMAX && !anim) start(level+1,'absorb'); });
    dn1.addEventListener('click', () => { if(level>1 && !anim) start(level-1,'emit'); });
    dnAll.addEventListener('click', () => { if(level>1 && !anim) start(1,'emit'); });
    const status = el('div', { class:'status-line', style:'min-height:18px' }, 'Absorb a photon to climb, then Emit and watch the light.');
    // ROYGBIV reference bar with a live marker
    const marker = el('div',{style:'position:absolute;top:-3px;width:3px;height:22px;background:#1c1917;box-shadow:0 0 0 2px #fff;border-radius:2px;left:0%;transition:left 220ms ease'});
    const bar = el('div',{style:'position:relative;height:16px;border-radius:8px;background:linear-gradient(to right,#ff2d2d,#ff8a00,#ffe000,#39d353,#2ec5ff,#6a5cff,#b14bff)'},[marker]);
    const specWrap = el('div',{style:'margin-top:8px'},[
      el('div',{style:'display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;color:var(--textWarmMuted);margin-bottom:3px'},[el('span',{},'700 nm · low f · red'), el('span',{},'violet · high f · 400 nm')]),
      bar ]);
    currentTick = (dt) => {
      ctx.clearRect(0,0,c.width,c.height);
      // ----- energy ladder (left) -----
      for (let n=1;n<=NMAX;n++){
        const y = yOf(n);
        ctx.strokeStyle = 'rgba(99,102,241,0.40)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(60,y); ctx.lineTo(250,y); ctx.stroke();
        ctx.fillStyle = '#7C6F5A'; ctx.font='600 13px Inter, sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
        ctx.fillText('n = '+n, 52, y);
        if (n===1){ ctx.fillStyle='#A0937B'; ctx.font='italic 10px Inter'; ctx.textAlign='left'; ctx.fillText('ground state', 90, y+14); }
      }
      let curY = yOf(level);
      if (anim) {
        anim.t = Math.min(1, anim.t + dt/(anim.dir==='emit'?520:600));
        const ease = anim.t<0.5 ? 2*anim.t*anim.t : 1-Math.pow(-2*anim.t+2,2)/2;
        curY = yOf(anim.from) + (yOf(anim.to)-yOf(anim.from))*ease;
        const col = anim.wl ? wavelengthToRGB(anim.wl) : '#f59e0b';
        const yA = yOf(anim.from), yB = yOf(anim.to), adir = anim.to>anim.from ? -1 : 1;
        ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.moveTo(264, yA); ctx.lineTo(264, yB); ctx.stroke();
        ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(264, yB); ctx.lineTo(259, yB-8*adir); ctx.lineTo(269, yB-8*adir); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
        if (anim.t >= 1) {
          level = anim.to;
          if (anim.dir === 'emit') {
            prevWL = lastWL; lastWL = anim.wl;
            const dist = anim.from - anim.to, f = (3000/anim.wl).toFixed(1), col2 = wavelengthToRGB(anim.wl);
            const wlA = prevWL==null?'':(anim.wl<prevWL?` <span style="color:#166534">${ICON.downSm} shorter</span>`:anim.wl>prevWL?` <span style="color:#9a3412">${ICON.upSm} longer</span>`:' = same');
            const fA  = prevWL==null?'':(anim.wl<prevWL?` <span style="color:#166534">${ICON.upSm} higher</span>`:anim.wl>prevWL?` <span style="color:#9a3412">${ICON.downSm} lower</span>`:' = same');
            status.innerHTML = `Fell <strong>n=${anim.from}→${anim.to}</strong> (${dist} level${dist>1?'s':''}) · λ <strong style="color:${col2}">${anim.wl} nm</strong>${wlA} · f <strong>${f}×10<span style="font-size:0.72em;vertical-align:0.4em">14</span> Hz</strong>${fA} · <strong style="color:${col2}">${colorName(anim.wl)}</strong>`;
            marker.style.left = Math.max(0,Math.min(100,(700-anim.wl)/300*100)) + '%';
          } else {
            status.innerHTML = `Absorbed a photon: now in <strong>n=${level}</strong>. Higher rung, more energy stored, ready to fall.`;
          }
          anim = null;
        }
      }
      // ----- emitted-light wave (right): wavelength + frequency you can SEE -----
      const WX0=300, WX1=506, WY=120, A=24;
      ctx.fillStyle='#57534E'; ctx.font='700 10px Roboto Mono'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.fillText('EMITTED LIGHT', (WX0+WX1)/2, WY-A-14);
      if (lastWL) {
        const col = wavelengthToRGB(lastWL);
        const pxPerCycle = lastWL/13;                 // shorter wavelength -> tighter wave
        wavePhase += dt * 0.004 * (600/lastWL);       // higher frequency -> faster wiggle
        ctx.strokeStyle = col; ctx.lineWidth = 2.6; ctx.shadowColor = col; ctx.shadowBlur = 8;
        ctx.beginPath();
        for (let x=WX0;x<=WX1;x++){ const y=WY + A*Math.sin((x-WX0)/pxPerCycle*Math.PI*2 - wavePhase); x===WX0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
        ctx.stroke(); ctx.shadowBlur = 0;
        // one-wavelength bracket
        const bx0=WX0+4, bx1=bx0+pxPerCycle, by=WY+A+9;
        ctx.strokeStyle='rgba(87,83,78,0.7)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(bx0,by-4); ctx.lineTo(bx0,by); ctx.lineTo(bx1,by); ctx.lineTo(bx1,by-4); ctx.stroke();
        ctx.fillStyle='#7C6F5A'; ctx.font='600 10px Inter'; ctx.textAlign='center'; ctx.textBaseline='top';
        ctx.fillText('one wavelength (λ)', (bx0+bx1)/2, by+3);
      } else {
        ctx.fillStyle='#A0937B'; ctx.font='italic 12px Inter'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('Emit to see the light wave', (WX0+WX1)/2, WY);
      }
      // ----- electron on the ladder -----
      const ex=EX, ey=curY;
      const g=ctx.createRadialGradient(ex,ey,0,ex,ey,18); g.addColorStop(0,'rgba(129,140,248,0.7)'); g.addColorStop(1,'rgba(129,140,248,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ex,ey,18,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#6366f1'; ctx.beginPath(); ctx.arc(ex,ey,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='700 11px Roboto Mono'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('e⁻', ex, ey);
    };
    stage.append(el('div',{class:'tool-row'},[up,dn1,dnAll]), status, specWrap);
  }
});

// ---- Step 5: Emission spectrum / Balmer ----
scenes.push({

  heading: 'Step 5: Emission Spectra',
  notes: "When an excited electron falls to energy level <strong>n = 2</strong>, it releases <strong>visible light</strong>. These transitions are the <strong>Balmer series</strong>. A bigger fall releases bluer light; a smaller fall releases redder light.",
  notebook: "<strong>Experience:</strong> click all four jumps (n = 3, 4, 5, 6 → 2) and watch where each line lands.<br><strong>Record:</strong> copy the spectrum and label the reddest and most violet lines.<br><strong>Confirm:</strong> check against your notes, then add one sentence connecting the size of the fall to the color of the line.",

    let drop = null; // {from, t}

        ctx.fillText('n='+n, 36, y);

      // electron drop
      if (drop) {

        ctx.beginPath(); ctx.moveTo(x,sy+8); ctx.lineTo(x,sy+sh-8); ctx.stroke(); ctx.shadowBlur=0;
        ctx.fillStyle=col; ctx.font='700 10px Roboto Mono'; ctx.textAlign='center'; ctx.textBaseline='top';
        ctx.fillText(fr+'→2', x, sy+sh+3);
      });
      ctx.fillStyle='#57534E'; ctx.font='600 11px Inter'; ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText('Hydrogen emission spectrum', sx+sw/2, sy+sh+18);

    stage.append(el('div',{class:'tool-row'}, btns), readout,

  }
});

      ctx.fillStyle='#A0937B'; ctx.font='700 10px Roboto Mono'; ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText('emission lines', sx+sw/2, sy+sh+6);
      ctx.fillStyle='#fff'; ctx.font='700 22px Roboto Serif, serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.fillText(active, 90, 70);
      ctx.fillStyle=f.col; ctx.font='600 13px Inter'; ctx.fillText(f.name, 90, 92);

  build(stage) {

    const states = [

      { sym:'Ca', z:20, mass:40, charge:2 }
    ];
    // symbol superscripts use chemistry notation (number then sign: 2−); prose charges stay sign-first (+2, −1)

    if(window.ClassQ) wireLive(); else window.addEventListener('classq-ready', wireLive, {once:true});

    const BAD=/\b(fuck|shit|bitch|damn|crap|ass|dick|piss)\b/i;
    btn.addEventListener('click', async () => {
      const qs = inputs.map(i=>i.value.trim()).filter(Boolean);
      if(!name.value.trim() || !klass.value.trim()){ msg.textContent='Add your name and class first.'; msg.classList.remove('complete'); return; }
      if(!qs.length){ msg.textContent='Type at least one question first.'; msg.classList.remove('complete'); return; }
      if(BAD.test(name.value) || BAD.test(klass.value) || qs.some(q=>BAD.test(q))){ msg.textContent='Keep it school-appropriate, please.'; msg.classList.remove('complete'); return; }
      btn.disabled=true; btn.textContent='Submitting...'; msg.textContent='';
      try {
        if(!window.ClassQ) throw new Error('offline');
        await window.ClassQ.submit({ app:APP, name:name.value.trim(), klass:klass.value.trim(), questions:qs });
        btn.textContent='Submitted'; msg.textContent = (window.ClassQ.mode==='live') ? 'Thanks! Added below for the class.' : 'Added below (demo mode on this device).'; msg.classList.add('complete');
        inputs.forEach(i=>i.value='');
      } catch(err){
        btn.disabled=false; btn.textContent='Submit my questions';
        msg.textContent='Could not submit, try again.'; msg.classList.remove('complete');
      }
    });
  }
});

// =====================================================
//  Reorder into the streamlined teaching flow:
//  1 lab segue · 2 Bohr shells · 3 energy ladder · 4 Balmer · 5 flame bench
//  · 6 identity · 7 isotopes · 8 ions · 9 particle counter · 10 Ar
//  · 11 abundance walkthrough · 12 practice · 13 your questions
// =====================================================
;(function(){
  const flow = [0, 2, 3, 4, 5, 1, 6, 7, 8, 9, 10, 11, 12];
  const ordered = flow.map(i => scenes[i]).filter(Boolean);
  if (ordered.length === scenes.length) { scenes.length = 0; scenes.push(...ordered); }
})();

// =====================================================
//  Nav controller
// =====================================================
const stageEl = $('#stage');
const stageLabel = $('#stageLabel');
const stepHeadingEl = $('#stepHeading');
const notesEl = $('#notes');
const notebookTextEl = $('#notebookText');
const stepIndicator = $('#stepIndicator');
const stepNumEl = $('#stepNum');
const stepTitleEl = $('#stepTitle');
const progressFill = $('#progressFill');
const prevBtn = $('#prevBtn');
const nextBtn = $('#nextBtn');
const resetBtn = $('#resetBtn');
let current = 0;
const pad2 = n => n < 10 ? '0'+n : ''+n;

function setScene(i) {
  current = i;
  currentTick = null;
  if (window._qUnsub) { try { window._qUnsub(); } catch(e){} window._qUnsub = null; }
  const s = scenes[i];
  stageEl.innerHTML = '';
  const shortTitle = s.heading.replace(/^Step \d+:\s*/, '');
  stageLabel.textContent = s.seeLabel || 'What you see';
  stepHeadingEl.textContent = 'Step ' + (i+1) + ': ' + shortTitle;
  stepNumEl.textContent = 'Step ' + pad2(i+1);
  stepTitleEl.textContent = shortTitle;
  notesEl.innerHTML = s.notes;
  notebookTextEl.innerHTML = s.notebook;
  stepIndicator.textContent = `${pad2(i+1)} / ${pad2(scenes.length)}`;
  progressFill.style.width = ((i+1)/scenes.length*100) + '%';
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === scenes.length-1;
  nextBtn.innerHTML = i === scenes.length-1 ? 'Done' : 'Next ' + ICON.right;
  s.build(stageEl);
  restoreWork(i);
  window.scrollTo({ top: 0, behavior: REDUCED_MOTION ? 'auto' : 'smooth' });
}
prevBtn.addEventListener('click', () => { if (current>0) setScene(current-1); });
nextBtn.addEventListener('click', () => { if (current<scenes.length-1) setScene(current+1); });
resetBtn.addEventListener('click', () => setScene(0));
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, button, [contenteditable="true"]')) return;
  if (e.key === 'ArrowRight' && current<scenes.length-1) setScene(current+1);
  if (e.key === 'ArrowLeft' && current>0) setScene(current-1);
});


// ===== Student work persistence =====
// Rebuilding a scene wipes anything typed into it, so every input, textarea,
// and select is keyed by scene + position and restored on re-entry. Saved to
// localStorage so a page reload keeps student work too.
const WORK_KEY = 'atomic-structure-student-work';
let WORK = {};
try { WORK = JSON.parse(localStorage.getItem(WORK_KEY)) || {}; } catch(e) { WORK = {}; }
let workTimer = null;
function persistWork(){ clearTimeout(workTimer); workTimer = setTimeout(() => { try { localStorage.setItem(WORK_KEY, JSON.stringify(WORK)); } catch(e){} }, 250); }
function workFields(){ return Array.from(stageEl.querySelectorAll('input, textarea, select')).filter(f => f.type !== 'password' && f.type !== 'file'); }
function workKey(scene, f, idx){ return scene + ':' + (f.type || f.tagName.toLowerCase()) + ':' + idx; }
function restoreWork(scene){
  workFields().forEach((f, idx) => {
    const k = workKey(scene, f, idx);
    if (!(k in WORK)) return;
    const v = WORK[k];
    if (f.type === 'checkbox' || f.type === 'radio') {
      if (f.checked !== v) { f.checked = v; f.dispatchEvent(new Event('change', { bubbles: true })); }
    } else if (String(f.value) !== String(v)) {
      f.value = v;
      f.dispatchEvent(new Event('input', { bubbles: true }));
      f.dispatchEvent(new Event('change', { bubbles: true }));
    }
  });
}
function recordWork(e){
  const f = e.target;
  if (!f || !f.matches || !f.matches('input, textarea, select')) return;
  if (f.type === 'password' || f.type === 'file') return;
  const idx = workFields().indexOf(f);
  if (idx < 0) return;
  WORK[workKey(current, f, idx)] = (f.type === 'checkbox' || f.type === 'radio') ? f.checked : f.value;
  persistWork();
}
stageEl.addEventListener('input', recordWork);
stageEl.addEventListener('change', recordWork);

setScene(0);
</script>
<script type="module">
/* ===== Class Questions collector =====
   Paste your Firebase web config below to turn on the SHARED, live, persistent class feed
   (one Firebase project can collect every app; rows are tagged by `app`).
   Leave the PASTE_ values to run in local DEMO mode (this browser only) so the UI still works. */
const firebaseConfig = {
  apiKey: "PASTE_FIREBASE_apiKey",
  authDomain: "PASTE_FIREBASE_authDomain",
  projectId: "PASTE_FIREBASE_projectId",
  appId: "PASTE_FIREBASE_appId"
};
const configured = !JSON.stringify(firebaseConfig).includes('PASTE_');
const listeners = {}, key = a => 'classq:' + a;
const readLocal = a => { try { return JSON.parse(localStorage.getItem(key(a)) || '[]'); } catch(e){ return []; } };
const notifyLocal = a => (listeners[a]||[]).forEach(cb => cb(readLocal(a)));
function setLocal(){
  window.ClassQ = {
    mode: 'demo',
    async submit(p){ const r={app:p.app,name:p.name||'',klass:p.klass||'',questions:p.questions||[],created:Date.now()}; const arr=readLocal(r.app); arr.unshift(r); localStorage.setItem(key(r.app), JSON.stringify(arr.slice(0,300))); notifyLocal(r.app); },
    subscribe(a,cb){ (listeners[a]=listeners[a]||[]).push(cb); cb(readLocal(a)); return ()=>{ listeners[a]=(listeners[a]||[]).filter(x=>x!==cb); }; },
    async clear(a){ localStorage.removeItem(key(a)); notifyLocal(a); }
  };
}
async function init(){
  if (!configured) { setLocal(); }
  else {
    try {
      const appMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      const fs = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      const db = fs.getFirestore(appMod.initializeApp(firebaseConfig));
      window.ClassQ = {
        mode: 'live',
        async submit(p){ await fs.addDoc(fs.collection(db,'questions'), {app:p.app,name:p.name||'',klass:p.klass||'',questions:p.questions||[],created:Date.now()}); },
        // filter by app server-side (no orderBy, so no composite index needed; sort client-side)
        // so other apps' traffic in the shared project can never evict this class's questions
        subscribe(a,cb){ const qy=fs.query(fs.collection(db,'questions'), fs.where('app','==',a), fs.limit(400));
          return fs.onSnapshot(qy, snap=>{ const list=[]; snap.forEach(d=>list.push(d.data())); list.sort((x,y)=>(y.created||0)-(x.created||0)); cb(list); }, ()=>cb([])); },
        async clear(a){ const snap=await fs.getDocs(fs.query(fs.collection(db,'questions'), fs.where('app','==',a))); for (const dd of snap.docs){ await fs.deleteDoc(dd.ref); } }
      };
    } catch(e){ setLocal(); }
  }
  window.dispatchEvent(new Event('classq-ready'));
}
init();
</script>
